name: Flutter Analyze

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: analyze-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Advisory only: formatting drift should not block a correctness review.
      - name: Format check
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib

      # Errors and warnings are fatal; infos are reported but do not fail the
      # build, so a fresh project does not drown in style hints.
      - name: Analyze
        run: flutter analyze
