name: Flutter Analyze

# Scope note: this repository currently holds only `lib/`, `pubspec.yaml`,
# `analysis_options.yaml` and docs. There is no `ios/`, `android/`, `web/` or
# `test/` directory, so this workflow deliberately stops at static analysis:
# there is nothing to build and no tests to run yet.
#
# Once the platform folders exist (`flutter create .`), add `flutter test` and
# a `flutter build` job here. Until then, a green run means "the code parses and
# satisfies the lint rules" - not "the app compiles".

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: analyze-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned deliberately, not `channel: stable`.
      #
      # On 2026-11-09 the stable channel moved from 3.47.9 to 3.50.0, which
      # deprecates `package:flutter/material.dart` in favour of
      # `package:material_ui/material_ui.dart`. That turned this job red with no
      # application code changing at all.
      #
      # Bumping this number is now a deliberate, reviewable act. Expect the
      # material_ui migration to come with it: every screen imports
      # `package:flutter/material.dart`, and `flutter analyze` fails on the
      # resulting infos.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Advisory only. Formatting drift is not a correctness problem, so it is
      # reported in the log but does not fail the run.
      - name: Format check
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib

      # Errors and warnings are fatal. Infos are not: a project this young
      # would otherwise go red over style hints alone.
      - name: Analyze
        run: flutter analyze
